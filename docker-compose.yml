x-app: &app
  build: .
  env_file:
    - booking_clone/settings/.env
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    <<: *app
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/booking_clone/staticfiles
      - media_volume:/app/booking_clone/mediafiles
    expose:
      - "8000"

  celery_worker:
    <<: *app
    command: celery -A settings worker -l info
    volumes:
      - sqlite_data:/app/data

  celery_beat:
    <<: *app
    command: celery -A settings beat -l info
    volumes:
      - sqlite_data:/app/data

  flower:
    <<: *app
    command: celery -A settings flower --basic-auth=$${FLOWER_USER}:$${FLOWER_PASSWORD}
    ports:
      - "5555:5555"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    restart: unless-stopped

volumes:
  sqlite_data:
  static_volume:
  media_volume:
