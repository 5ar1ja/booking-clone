x-app: &app
  build: .
  environment:
    - BOOKING_ENV_ID=prod
    - DATABASE_URL=postgres://postgres:123456@db:5432/booking
    - REDIS_HOST=redis
  depends_on:
    redis:
      condition: service_healthy
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    <<: *app
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application
    volumes:
      - static_volume:/app/booking_clone/staticfiles
      - media_volume:/app/booking_clone/mediafiles
    expose:
      - "8000"

  celery_worker:
    <<: *app
    entrypoint: []
    command: sh -c "celery -A settings.celery worker -l info"

  celery_beat:
    <<: *app
    entrypoint: []
    command: sh -c "celery -A settings.celery beat -l info"

  flower:
    <<: *app
    entrypoint: []
    command: sh -c "celery -A settings.celery flower --basic-auth=$${FLOWER_USER:-admin}:$${FLOWER_PASSWORD:-admin}"
    ports:
      - "5555:5555"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    restart: unless-stopped

volumes:
  pg_data:
  static_volume:
  media_volume:
