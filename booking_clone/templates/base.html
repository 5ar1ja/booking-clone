{% load i18n %}

<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% trans "Booking Clone" %}{% endblock %}</title>
    <style>
        body {
            margin: 0;
            color: #172033;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7fb;
        }

        header,
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 32px;
        }

        p {
            line-height: 1.55;
        }

        .language-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .panel {
            border: 1px solid #dce1ea;
            border-radius: 8px;
            padding: 24px;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <strong>{% trans "Booking Clone" %}</strong>
        <form class="language-form" action="{% url 'set_language' %}" method="post">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.get_full_path }}">
            <label for="language-select">{% trans "Language" %}</label>
            <select id="language-select" name="language">
                {% get_current_language as CURRENT_LANGUAGE %}
                {% get_available_languages as AVAILABLE_LANGUAGES %}
                {% for code, name in AVAILABLE_LANGUAGES %}
                    <option value="{{ code }}"{% if code == CURRENT_LANGUAGE %} selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
            <button type="submit">{% trans "Change" %}</button>
        </form>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
